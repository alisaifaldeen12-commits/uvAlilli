<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Subtle Glowing Atmosphere -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="25%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="100%" height="100%" fill="#070e1a" rx="100"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Golden Frame Circle representation of the Basra ChemEng union -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#d4a843" stroke-width="6" stroke-dasharray="10 6" opacity="0.8"/>

  <!-- Light Source Ray (Refraction optics) -->
  <path d="M 80 256 L 220 256" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <polygon points="210,246 230,256 210,266" fill="#ffffff"/>

  <!-- The Cuvette / Prism (Beating heart of the spectrometer) -->
  <polygon points="256,150 350,330 162,330" fill="none" stroke="url(#flaskGrad)" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Liquid inside the flask -->
  <path d="M 190 280 Q 256 295 322 280 L 334 310 Q 256 325 178 310 Z" fill="#10b981" opacity="0.85"/>
  <circle cx="230" cy="300" r="8" fill="#ffffff" opacity="0.5"/>
  <circle cx="280" cy="290" r="5" fill="#ffffff" opacity="0.6"/>

  <!-- Diffracted Colored Spectrum -->
  <path d="M 256 256 L 432 170 M 256 256 L 432 210 M 256 256 L 432 250 M 256 256 L 432 290 M 256 256 L 432 330" stroke="url(#spectrum)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Icon Title Accent -->
  <text x="256" y="440" fill="#d4a843" font-family="sans-serif" font-weight="bold" font-size="28" text-anchor="middle" letter-spacing="2">UV-VIS LAB</text>
</svg>
